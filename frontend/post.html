<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Details | SocialHub</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        .post-detail-container {
            max-width: 700px;
            margin: 0 auto;
        }
        
        .comment-section {
            background: #fff;
            border-radius: 18px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 5px 18px rgba(0,0,0,.08);
        }

        .comment-section h3 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #f4f6fb;
            padding-bottom: 10px;
        }

        .comment-form {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .comment-form textarea {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            resize: none;
            outline: none;
            font-size: 14px;
            height: 45px;
            transition: all 0.3s ease;
        }

        .comment-form textarea:focus {
            border-color: #ff4d79;
            height: 80px;
        }

        .comment-form button {
            background: linear-gradient(90deg, #ff4d79, #ff8c42);
            color: #fff;
            border: none;
            padding: 0 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            height: 45px;
        }

        .comment-form button:hover {
            transform: scale(1.05);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .comment-item {
            display: flex;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f4f6fb;
        }

        .comment-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .comment-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .comment-content {
            flex: 1;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 15px;
            position: relative;
        }

        .comment-content h4 {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }

        .comment-content p {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }

        .delete-comment-btn {
            position: absolute;
            right: 15px;
            top: 12px;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
            transition: 0.3s;
        }

        .delete-comment-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .no-comments {
            text-align: center;
            color: #777;
            padding: 20px 0;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>SocialHub</h2>
        </div>

        <ul class="menu">
            <li><a href="feed.html"><i class="fas fa-house"></i> Home</a></li>
            <li><a href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="create.html"><i class="fas fa-square-plus"></i> Create Post</a></li>
            <li><a href="#"><i class="fas fa-heart"></i> Notifications</a></li>
            <li><a href="#"><i class="fas fa-message"></i> Messages</a></li>
            <li><a href="#"><i class="fas fa-users"></i> Friends</a></li>
            <li><a href="login.html"><i class="fas fa-right-from-bracket"></i> Logout</a></li>
        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Navbar -->
        <header class="navbar">

            <div class="search">
                <input type="text" placeholder="Search users, posts...">
            </div>

            <div class="nav-icons">
                <i class="fas fa-bell"></i>
                <i class="fas fa-envelope"></i>
                <i class="fas fa-user-circle"></i>
            </div>

        </header>

        <!-- Post Detail Layout -->
        <div class="post-detail-container">
            
            <!-- Post Container -->
            <div id="postContainer" class="feed" style="margin-top: 0; display: block;">
                <!-- Post card loaded dynamic using JS -->
                <p style="text-align: center; padding: 50px 0;">Loading post details...</p>
            </div>

            <!-- Comment Section -->
            <div class="comment-section">
                <h3>Comments</h3>

                <!-- Add Comment Form -->
                <form id="commentForm" class="comment-form">
                    <textarea id="commentText" placeholder="Add a comment..." required></textarea>
                    <button type="submit">Post</button>
                </form>

                <!-- Comments List -->
                <div id="commentsList" class="comments-list">
                    <!-- Dynamic comments loaded using JS -->
                </div>
            </div>

        </div>

    </main>

</div>

<script src="js/post.js"></script>

</body>
</html>
